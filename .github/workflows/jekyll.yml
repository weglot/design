name: Deploy Jekyll site to Pages

on:
    push:
        branches:
            - master
        tags:
            - '*'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version:
                    - master
                    - 2.7.0

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    ref: ${{ matrix.version == 'master' && 'master' || matrix.version }}
                    persist-credentials: false

            -   name: Setup Ruby
                uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
                with:
                    working-directory: ./styleguide
                    ruby-version: '3.1'
                    bundler-cache: true

            -   name: Setup Pages
                id: pages
                uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            -   run: npm install

            -   run: |
                    if [ "${{ matrix.version }}" == "master" ]; then
                      npm run build docs/
                    else
                     npm run build docs/${{ matrix.version }}
                    fi

            -   name: Build with Jekyll
                run: |
                    if [ "${{ matrix.version }}" == "master" ]; then
                      bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --destination ../docs
                    else
                      bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}/${{ matrix.version }}" --destination ../docs/${{ matrix.version }}
                    fi
                working-directory: ./styleguide
                env:
                    JEKYLL_ENV: production
            -   run: npm install

            -   name: Upload artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ matrix.version }}
                    path: docs/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download All Artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                path: docs/
                merge-multiple: true

            -   name: Upload artifact
                uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                with:
                    path: docs/

            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
