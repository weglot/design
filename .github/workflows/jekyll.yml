name: Deploy Jekyll site to Pages

on:
    push:
        branches:
            - master
        tags:
            - '*'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version:
                    - master
                    - 2.7.0

        steps:
            -   name: Checkout
                uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
                with:
                    ref: ${{ matrix.version == 'master' && 'master' || matrix.version }}
                    persist-credentials: false

            -   name: Setup Ruby
                uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
                with:
                    working-directory: ./styleguide
                    ruby-version: '3.1'
                    bundler-cache: true

            -   name: Setup Pages
                id: pages
                uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

            -   run: npm install

            -   run: |
                    if [ "${{ matrix.version }}" == "master" ]; then
                      npm run build docs/
                    else
                     npm run build docs/${{ matrix.version }}
                    fi

            -   name: Build with Jekyll
                run: |
                    if [ "${{ matrix.version }}" == "master" ]; then
                      bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --destination ../docs
                    else
                      bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}/${{ matrix.version }}" --destination ../docs/${{ matrix.version }}
                    fi
                working-directory: ./styleguide
                env:
                    JEKYLL_ENV: production
            -   run: npm install

            -   name: Upload artifact
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: ${{ matrix.version }}
                    path: docs/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download All Artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                path: docs/
                merge-multiple: true

            -   name: Upload artifact
                uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                with:
                    path: docs/

            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
